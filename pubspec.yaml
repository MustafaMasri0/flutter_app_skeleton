name: flutter_app_skeleton
description: "A solid Flutter app skeleton with layered architecture, ready-to-use configuration, and example integrations for networking, theming, and state management."

publish_to: "none" #

version: 1.0.0+1

environment:
  sdk: ^3.8.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.2.4
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  pretty_dio_logger: ^1.4.0
  flutter_dotenv: ^6.0.0
  freezed_annotation: ^3.1.0
  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  gap: ^3.0.1
  google_fonts: ^6.3.2
  connectivity_plus: ^7.0.0
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  build_runner:
  custom_lint:
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  go_router_builder: ^4.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - .env.dev
